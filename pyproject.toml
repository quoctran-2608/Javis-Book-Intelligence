[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "javis-book-intelligence"
version = "0.1.0"
description = "Local EPUB library, SQLite metadata and instant full-text search (Milestone 1)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1", "python-multipart>=0.0.9,<1", "beautifulsoup4>=4.12,<5", "jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
javis-books = "javis_book_intelligence.main:main"

[tool.setuptools.packages.find]
include = ["javis_book_intelligence*"]

[tool.setuptools.package-data]
javis_book_intelligence = ["migrations/*.sql", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
